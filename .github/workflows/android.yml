name: Android unit tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 기본값은 기본 브랜치에서만 캐시를 저장한다. 기능 브랜치도 저장해야 배포판과 의존성을 매번 새로 받지 않는다.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # compileSdk 36 구성 요소가 러너에 없으면 AGP가 받을 수 있도록 라이선스를 미리 동의해 둔다.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # services.gradle.org가 504/시간 초과를 돌려줘 테스트가 시작도 못 한 일이 두 번 있었다(2026-11-09).
      # 이 주소는 GitHub 릴리스로 넘겨 주는 중간 단계일 뿐이라, 러너에서만 GitHub 주소를 바로 쓴다(저장소 설정은 그대로).
      - name: Point the wrapper at the GitHub-hosted Gradle distribution
        run: |
          version=$(grep -oP 'gradle-\K[0-9.]+(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
          sed -i "s|^distributionUrl=.*|distributionUrl=https\\://github.com/gradle/gradle-distributions/releases/download/v${version}/gradle-${version}-bin.zip|" gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      # 내려받기만 따로 재시도한다. 한 번에 2분을 넘기면 끊고 다시 한다.
      - name: Fetch Gradle distribution (with retries)
        run: |
          for i in 1 2 3 4; do
            timeout 120 ./gradlew --version && exit 0
            echo "::warning::Gradle 내려받기 ${i}번째 실패, 15초 뒤 다시 시도"
            sleep 15
          done
          exit 1

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # 릴리스와 같은 R8(코드 축소·난독화) 설정으로 빌드가 되는지 확인한다.
      # 단위 테스트로는 R8이 지운 클래스 때문에 생기는 오류를 잡을 수 없어서, 실기기 시험용 APK도 만든다(docs/device-check.md).
      - name: Build release (unsigned) and releaseCheck
        run: ./gradlew :app:assembleRelease :app:assembleReleaseCheck

      - name: Upload releaseCheck APK and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: releaseCheck-apk
          path: |
            app/build/outputs/apk/releaseCheck/*.apk
            app/build/outputs/mapping/releaseCheck/mapping.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
