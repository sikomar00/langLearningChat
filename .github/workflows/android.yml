name: Android unit tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 기본값은 기본 브랜치에서만 캐시를 저장한다. 기능 브랜치도 저장해야 배포판과 의존성을 매번 새로 받지 않는다.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # compileSdk 36 구성 요소가 러너에 없으면 AGP가 받을 수 있도록 라이선스를 미리 동의해 둔다.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # services.gradle.org가 일시적으로 504/시간 초과를 돌려주는 일이 있어(2026-11-09 두 번 확인), 내려받기만 따로 재시도한다.
      - name: Fetch Gradle distribution (with retries)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "::warning::Gradle 내려받기 ${i}번째 실패, $((i * 20))초 뒤 다시 시도"
            sleep $((i * 20))
          done
          exit 1

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
